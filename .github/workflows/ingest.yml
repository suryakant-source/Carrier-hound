name: Daily Job Ingestion & Cleanup Pipeline

on:
  schedule:
    # Runs daily at 02:00 AM IST (20:30 UTC)
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no writes to Supabase)'
        required: false
        type: boolean
        default: false
      cap:
        description: 'Maximum jobs to ingest in this run'
        required: false
        type: string
        default: '2000'
      seed:
        description: 'Use companies-seed.json (52+ verified tech companies)'
        required: false
        type: boolean
        default: true
      source:
        description: 'Specific source ID to run (leave blank for all)'
        required: false
        type: string
        default: ''

jobs:
  ingest:
    name: Fetch & Ingest Jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Job Ingestion Pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.seed }}" != "false" ]; then
            ARGS="$ARGS --seed"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry"
          fi
          if [ -n "${{ github.event.inputs.cap }}" ]; then
            ARGS="$ARGS --cap ${{ github.event.inputs.cap }}"
          fi
          if [ -n "${{ github.event.inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ github.event.inputs.source }}"
          fi
          npx tsx scripts/ingest.ts $ARGS
